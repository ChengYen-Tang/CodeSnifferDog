name: CI

on:
  pull_request:
    branches:
      - "**"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - master
      - release
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore CodeSnifferDog.slnx

      - name: Build
        run: dotnet build CodeSnifferDog.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CodeSnifferDog.slnx --configuration Release --no-build --no-restore --verbosity normal

      - name: Publish and run single-file PowerShell smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          $platform = if ($IsWindows) { "win" } elseif ($IsMacOS) { "osx" } elseif ($IsLinux) { "linux" } else { throw "Unsupported CI operating system." }

          $rid = "$platform-$architecture"
          $publishDirectory = Join-Path $env:RUNNER_TEMP "CodeSnifferDog.SingleFileSmoke/$rid"
          New-Item -ItemType Directory -Path $publishDirectory -Force | Out-Null

          dotnet publish CodeSnifferDog.SingleFileSmoke/CodeSnifferDog.SingleFileSmoke.csproj `
            --configuration Release `
            --runtime $rid `
            --self-contained true `
            --nologo `
            --verbosity minimal `
            -p:UseAppHost=true `
            -p:PublishSingleFile=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishTrimmed=false `
            -p:PublishReadyToRun=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:PublishDir="$publishDirectory/"

          if ($LASTEXITCODE -ne 0) {
            throw "Single-file smoke publish failed with exit code $LASTEXITCODE."
          }

          $executableName = "CodeSnifferDog.SingleFileSmoke"
          if ($IsWindows) {
            $executableName += ".exe"
          }

          $executable = Join-Path $publishDirectory $executableName

          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Single-file smoke executable was not published: $executable"
          }

          $publishedItems = @(Get-ChildItem -LiteralPath $publishDirectory -Force)
          $unexpectedItems = @($publishedItems | Where-Object { $_.Name -ne $executableName })
          if ($unexpectedItems.Count -ne 0) {
            $unexpectedNames = $unexpectedItems.Name -join ", "
            throw "Expected a single-file publish, but found additional output: $unexpectedNames"
          }

          & $executable

          if ($LASTEXITCODE -ne 0) {
            throw "Single-file PowerShell smoke test failed with exit code $LASTEXITCODE."
          }
