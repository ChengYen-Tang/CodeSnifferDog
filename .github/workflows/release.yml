name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - release
      - "release/**"

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  SERVER_PROJECT: CodeSnifferDog.Server/CodeSnifferDog.Server/CodeSnifferDog.Server.csproj

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Create tag and GitHub release
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      target_sha: ${{ steps.release.outputs.target_sha }}
    steps:
      - name: Checkout CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Create release tag and GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.0.0-preview.2
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Bump RELEASE_TAG for the next release cycle.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG"; then
            existing_sha=$(git rev-list -n 1 "$RELEASE_TAG")
            if [[ "$existing_sha" != "$TARGET_SHA" ]]; then
              echo "Tag $RELEASE_TAG already points to $existing_sha, not $TARGET_SHA. Bump RELEASE_TAG before releasing another commit." >&2
              exit 1
            fi
          else
            git tag -a "$RELEASE_TAG" "$TARGET_SHA" -m "Release $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; continuing so assets can be refreshed."
          else
            release_args=(
              "$RELEASE_TAG"
              --repo "$GITHUB_REPOSITORY"
              --title "$RELEASE_TAG"
              --generate-notes
              --verify-tag
            )
            if [[ "$RELEASE_TAG" == *-* ]]; then
              release_args+=(--prerelease)
            fi

            gh release create "${release_args[@]}"
          fi

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.rid }}
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-15
          - rid: osx-x64
            os: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.target_sha }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained single-file server
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
        run: |
          $publishDirectory = Join-Path $env:GITHUB_WORKSPACE "artifacts/publish/$env:RID"
          New-Item -ItemType Directory -Path $publishDirectory -Force | Out-Null

          # ReleaseSingleFile.pubxml owns the server RID. Do not add -r here:
          # a global RID is propagated to the Blazor WebAssembly project.
          dotnet publish $env:SERVER_PROJECT `
            --configuration Release `
            --nologo `
            --verbosity minimal `
            -p:PublishProfile=ReleaseSingleFile `
            -p:ReleaseRuntimeIdentifier=$env:RID `
            -p:PublishDir="$publishDirectory/"

      - name: Create release archive
        id: package
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          $publishDirectory = Join-Path $env:GITHUB_WORKSPACE "artifacts/publish/$env:RID"
          $archive = Join-Path $env:GITHUB_WORKSPACE "CodeSnifferDog.Server-$env:RELEASE_TAG-$env:RID.zip"
          if (Test-Path $archive) {
            Remove-Item -LiteralPath $archive -Force
          }

          Compress-Archive `
            -Path (Join-Path $publishDirectory '*') `
            -DestinationPath $archive `
            -CompressionLevel Optimal

          "archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload release archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          gh release upload $env:RELEASE_TAG "${{ steps.package.outputs.archive }}" `
            --repo $env:GITHUB_REPOSITORY `
            --clobber
